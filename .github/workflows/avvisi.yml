name: Avvisi Telegram della famiglia

on:
  schedule:
    - cron: '7 * * * *'        # ogni ora: collega i nuovi e, all'ora scelta, manda il promemoria
  workflow_dispatch:
    inputs:
      forza:
        description: 'Manda subito il promemoria (1 = sì)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: avvisi
  cancel-in-progress: false

jobs:
  avvisi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Giro degli avvisi
        env:
          FAM_CHIAVE: ${{ secrets.FAM_CHIAVE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FORZA: ${{ github.event.inputs.forza }}
        run: node .github/avvisi.mjs
      # GitHub spegne i lavori programmati dopo 60 giorni senza attività nel
      # repository: una volta al mese lasciamo un segno per tenerli accesi.
      - name: Tieni acceso
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Europe/Rome date +%d%H)" = "0103" ]; then
            date -u +%F > .github/vivo.txt
            git config user.name "famiglia-bot"
            git config user.email "famiglia-bot@users.noreply.github.com"
            git add .github/vivo.txt
            git commit -m "Tieni acceso il promemoria" && git push || true
          fi
